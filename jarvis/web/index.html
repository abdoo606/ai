<!doctype html>
<html lang="en" dir="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<style>
  :root { --bg:#0b1220; --panel:#131d30; --line:#22304d; --text:#e6edf7; --muted:#8fa0bf; --accent:#27d3ff; --user:#1e3a5f; --bot:#192740; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:18px; margin:0; letter-spacing:.08em; color:var(--accent); }
  .dot { width:9px; height:9px; border-radius:50%; background:#3ddc84; box-shadow:0 0 10px #3ddc84; }
  .status { color:var(--muted); font-size:13px; margin-inline-start:auto; }
  main { flex:1; display:grid; grid-template-columns: 1fr 300px; min-height:0; }
  #chat { display:flex; flex-direction:column; min-height:0; }
  #log { flex:1; overflow-y:auto; padding:18px 20px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:78%; padding:10px 14px; border-radius:12px; line-height:1.55; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--user); }
  .bot { align-self:flex-start; background:var(--bot); border:1px solid var(--line); }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  input[type=text] { flex:1; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:15px; }
  button { padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; font-size:15px; }
  button:hover { border-color:var(--accent); }
  button.active { border-color:var(--accent); color:var(--accent); }
  aside { border-inline-start:1px solid var(--line); padding:16px; overflow-y:auto; background:var(--panel); }
  aside h2 { font-size:14px; color:var(--muted); margin:6px 0 8px; text-transform:uppercase; letter-spacing:.06em; }
  aside textarea { width:100%; min-height:60px; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; }
  aside .row { display:flex; gap:6px; margin-top:6px; }
  aside pre { white-space:pre-wrap; font-size:13px; color:var(--muted); background:var(--bg); padding:8px; border-radius:8px; border:1px solid var(--line); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } aside { display:none; } }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>JARVIS</h1>
  <span class="status" id="status">connecting…</span>
</header>
<main>
  <section id="chat">
    <div id="log"></div>
    <form id="form">
      <button type="button" id="mic" title="Speak">🎤</button>
      <input type="text" id="input" placeholder="Ask anything, or: learn <topic> / تعلم <موضوع>" autocomplete="off" autofocus>
      <button type="button" id="speak" title="Read replies aloud">🔈</button>
      <button type="submit">Send</button>
    </form>
  </section>
  <aside>
    <h2>Learn a topic</h2>
    <textarea id="topic" placeholder="e.g. quantum computing"></textarea>
    <div class="row"><button id="learn">Deep-learn and archive</button></div>
    <h2 style="margin-top:18px">Recall</h2>
    <textarea id="q" placeholder="What do you know about…"></textarea>
    <div class="row"><button id="recall">Search memory</button></div>
    <h2 style="margin-top:18px">Output</h2>
    <pre id="panel">Ready.</pre>
    <div class="row" style="margin-top:14px"><button id="reset">New conversation</button></div>
  </aside>
</main>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const panel = document.getElementById('panel');
const statusEl = document.getElementById('status');
let speakReplies = false;

function add(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

async function api(path, body) {
  const opts = body === undefined ? {} : {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
  };
  const r = await fetch(path, opts);   // relative URL: works behind the preview proxy
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function say(text) {
  if (!speakReplies || !('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = /[\u0600-\u06FF]/.test(text) ? 'ar' : 'en-US';
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

async function send(text) {
  text = text.trim();
  if (!text) return;
  add('user', text);
  const pending = add('bot', '…');
  try {
    const data = await api('/api/chat', {message: text});
    pending.textContent = data.reply;
    say(data.reply);
  } catch (e) {
    pending.textContent = 'Error: ' + e.message;
  }
}

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  const t = input.value; input.value = '';
  send(t);
});

document.getElementById('learn').onclick = async () => {
  const topic = document.getElementById('topic').value.trim();
  if (!topic) return;
  panel.textContent = 'Mapping the field, reading sources, and building local memory about "' + topic + '"… This can take several minutes.';
  try { panel.textContent = (await api('/api/learn', {topic})).result; }
  catch (e) { panel.textContent = 'Error: ' + e.message; }
};

document.getElementById('recall').onclick = async () => {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  try { panel.textContent = (await api('/api/recall?q=' + encodeURIComponent(q))).result; }
  catch (e) { panel.textContent = 'Error: ' + e.message; }
};

document.getElementById('reset').onclick = async () => {
  await api('/api/reset', {}); log.innerHTML = ''; panel.textContent = 'New conversation.';
};

// Speech input (Chrome, Edge, Safari). Falls back to typing when unavailable.
const mic = document.getElementById('mic');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const rec = new SR();
  rec.continuous = false;
  rec.interimResults = true;
  rec.lang = navigator.language || 'en-US';
  rec.onresult = e => {
    const text = Array.from(e.results).map(r => r[0].transcript).join(' ');
    input.value = text;
    if (e.results[e.results.length - 1].isFinal) { mic.classList.remove('active'); send(text); input.value = ''; }
  };
  rec.onend = () => mic.classList.remove('active');
  mic.onclick = () => { mic.classList.add('active'); rec.start(); };
} else {
  mic.disabled = true; mic.title = 'Speech input needs Chrome or Edge';
}

const speakBtn = document.getElementById('speak');
speakBtn.onclick = () => { speakReplies = !speakReplies; speakBtn.classList.toggle('active', speakReplies); };

(async () => {
  try {
    const s = await api('/api/status');
    statusEl.textContent = s.llm === 'local-ensemble'
      ? '3 local brains: intent + العربية + English'
      : (s.llm === 'huggingface-local' ? 'local brain: ' + s.model : 'offline brain (standalone)');
    add('bot', 'Good day. How can I help? Try "learn quantum computing", then "recall how qubits work".');
  } catch (e) {
    statusEl.textContent = 'server not reachable';
    document.getElementById('dot').style.background = '#ff5c5c';
  }
})();
</script>
</body>
</html>
