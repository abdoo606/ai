name: Zehnora CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=83"
      - run: python -m pip install -r zehnora/requirements-dev.txt
      - run: python -m py_compile zehnora/*.py zehnora/scripts/*.py
      - run: ruff check zehnora
      - run: bandit -q -r zehnora -x zehnora/tests
      - run: coverage run --source=zehnora -m pytest -q
      - run: coverage report --omit='zehnora/tests/*' --fail-under=80
      - run: pip-audit

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip "setuptools>=83" build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: zehnora-local "time"
